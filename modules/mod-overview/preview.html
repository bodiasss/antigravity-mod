<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Overview - Antigravity UI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>

  <!-- Container for the Mod Overview UI Component -->
  <div id="mod-overview-mount"></div>

  <script src="index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize component
      const component = ModOverview.init('#mod-overview-mount');

      // 2. Attempt to fetch live data if served from preview-server or API
      try {
        const res = await fetch('/api/overview');
        if (res.ok) {
          const liveData = await res.json();
          if (liveData) component.update(liveData);

          // Listen for SSE real-time push updates
          if (window.EventSource) {
            const es = new EventSource('/api/events');
            es.onmessage = (e) => {
              try {
                const updated = JSON.parse(e.data);
                if (updated) component.update(updated);
              } catch (_) {}
            };
          }
        }
      } catch (_) {
        // Running locally file:// - fallback to default built-in data
      }
    });
  </script>
</body>
</html>
